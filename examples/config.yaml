apisix:
  node_listen: 9080
  extra_lua_path: /opt/mcp-proxy/?.lua
  # Replace the proxy IP with your verified ingress address; never trust all peers.
  trusted_addresses:
    - 127.0.0.1
    - 10.20.30.40
nginx_config:
  http:
    real_ip_header: X-Forwarded-For
    real_ip_recursive: 'on'
    real_ip_from:
      - 127.0.0.1
      - 10.20.30.40
    custom_lua_shared_dict:
      mcp_proxy_tickets: 8m
  http_server_configuration_snippet: |
    proxy_buffering off;
    client_body_buffer_size 8m;
    lua_check_client_abort on;
# Merge with your existing plugin list.
plugins:
  - openid-connect
  - ip-restriction
  - mcp-proxy
